# Sveltia CMS — پنل مدیریت محتوا (سازگار با Decap/Netlify CMS)
# مسیر پنل:  https://<user>.github.io/admin/
backend:
  name: github
  repo: amhasani2a/amhasani2a.github.io # ← اگر اسم ریپو فرق دارد، اینجا را عوض کن
  branch: main
  # برای لاگین روی سایت منتشرشده، آدرس OAuth worker خودت را بگذار (README را ببین):
  # base_url: https://<your-worker>.workers.dev
  commit_messages:
    create: "content: create {{collection}} “{{slug}}”"
    update: "content: update {{collection}} “{{slug}}”"
    delete: "content: delete {{collection}} “{{slug}}”"
    uploadMedia: "content: upload {{path}}"
    deleteMedia: "content: delete {{path}}"

media_folder: public/uploads
public_folder: /uploads

i18n:
  structure: multiple_folders
  locales: [fa, en]
  default_locale: fa

collections:
  # -------- تنظیمات کلی --------
  - name: settings
    label: تنظیمات سایت
    files:
      - name: general
        label: عمومی
        file: src/data/settings.json
        fields:
          - { name: githubUsername, label: یوزرنیم گیت‌هاب, widget: string }
          - { name: email, label: ایمیل, widget: string }
          - { name: newsletterAction, label: آدرس فرم خبرنامه, widget: string, required: false }
          - { name: maxRepos, label: تعداد پروژه در صفحه, widget: number, default: 9 }
          - { name: articlesFeed, label: آدرس فید RSS مقاله‌ها, widget: string, required: false }
          - { name: articlesSiteFa, label: نام سایت مقاله‌ها (فارسی), widget: string, required: false }
          - { name: articlesSiteEn, label: نام سایت مقاله‌ها (انگلیسی), widget: string, required: false }
          - name: excludeRepos
            label: مخازنی که نمایش داده نشوند
            widget: list
            required: false
            field: { name: repo, label: نام مخزن, widget: string }
          - name: featuredProjects
            label: پروژه‌های شاخص
            widget: list
            required: false
            fields:
              - { name: name, label: عنوان, widget: string }
              - { name: label, label: نشانی نمایشی, widget: string }
              - { name: url, label: لینک, widget: string }
              - { name: descriptionFa, label: توضیح فارسی, widget: text }
              - { name: descriptionEn, label: توضیح انگلیسی, widget: text }
              - name: tags
                label: برچسب‌ها
                widget: list
                required: false
                field: { name: tag, label: برچسب, widget: string }
          - name: pinnedRepos
            label: پروژه‌های مهم (اول نمایش داده می‌شوند)
            widget: list
            required: false
            field: { name: repo, label: نام مخزن, widget: string }
          - name: social
            label: شبکه‌های اجتماعی
            widget: list
            fields:
              - { name: label, label: عنوان, widget: string }
              - { name: url, label: لینک, widget: string }

      - name: profile_fa
        label: معرفی و رزومه (فارسی)
        file: src/data/profile.fa.json
        fields: &profileFields
          - { name: name, label: نام, widget: string }
          - { name: role, label: عنوان شغلی, widget: string }
          - { name: tagline, label: شعار کوتاه, widget: string }
          - { name: heroTitle, label: تیتر اصلی, widget: string }
          - { name: heroSubtitle, label: زیرتیتر, widget: text }
          - { name: location, label: مکان, widget: string }
          - { name: availability, label: وضعیت همکاری, widget: string }
          - { name: resumeUrl, label: لینک رزومه PDF, widget: string, required: false }
          - { name: avatar, label: تصویر پروفایل, widget: image, required: false }
          - name: bio
            label: درباره من (هر بند یک مورد)
            widget: list
            field: { name: paragraph, label: پاراگراف, widget: text }
          - name: skills
            label: مهارت‌ها
            widget: list
            fields:
              - { name: group, label: دسته, widget: string }
              - name: items
                label: موارد
                widget: list
                field: { name: item, label: مهارت, widget: string }
          - name: experience
            label: تجربه کاری
            widget: list
            fields:
              - { name: title, label: سمت, widget: string }
              - { name: org, label: سازمان, widget: string }
              - { name: period, label: بازه زمانی, widget: string }
              - { name: description, label: توضیح, widget: text }
          - { name: contactText, label: متن بخش تماس, widget: text }
          - { name: newsletterText, label: متن خبرنامه, widget: text }

      - name: profile_en
        label: Profile & resume (English)
        file: src/data/profile.en.json
        fields: *profileFields

  # -------- وبلاگ فارسی --------
  - name: blog_fa
    label: وبلاگ (فارسی)
    label_singular: نوشته
    folder: src/content/blog/fa
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    fields: &postFields
      - { name: title, label: عنوان, widget: string }
      - { name: description, label: خلاصه, widget: text, required: false }
      - { name: date, label: تاریخ, widget: datetime, date_format: "YYYY-MM-DD", time_format: false }
      - { name: lang, label: زبان, widget: hidden, default: fa }
      - { name: cover, label: تصویر کاور, widget: image, required: false }
      - name: tags
        label: برچسپ‌ها
        widget: list
        required: false
        field: { name: tag, label: برچسپ, widget: string }
      - { name: draft, label: پیش‌نویس (منتشر نشود), widget: boolean, default: false }
      - { name: body, label: متن, widget: markdown }

  # -------- وبلاگ انگلیسی --------
  - name: blog_en
    label: Blog (English)
    label_singular: Post
    folder: src/content/blog/en
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    fields:
      - { name: title, label: Title, widget: string }
      - { name: description, label: Summary, widget: text, required: false }
      - { name: date, label: Date, widget: datetime, date_format: "YYYY-MM-DD", time_format: false }
      - { name: lang, label: Language, widget: hidden, default: en }
      - { name: cover, label: Cover image, widget: image, required: false }
      - name: tags
        label: Tags
        widget: list
        required: false
        field: { name: tag, label: Tag, widget: string }
      - { name: draft, label: Draft, widget: boolean, default: false }
      - { name: body, label: Body, widget: markdown }
